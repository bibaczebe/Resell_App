[build]
builder = "NIXPACKS"

[deploy]
# Single worker so the in-process APScheduler runs exactly once (2 workers ran
# two schedulers → duplicate polling + doubled scraper spend). Threads give
# request concurrency so a slow /current-matches scrape doesn't block the app.
startCommand = "gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
